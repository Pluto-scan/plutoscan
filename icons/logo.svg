<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PlutoScan">
  <defs>
    <linearGradient id="ps-planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C3CE1"/>
      <stop offset="1" stop-color="#1E90FF"/>
    </linearGradient>
    <clipPath id="ps-front"><rect x="0" y="32" width="64" height="32"/></clipPath>
  </defs>
  <!-- ring, back half (behind the planet) -->
  <ellipse cx="32" cy="32" rx="29" ry="8.5" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" transform="rotate(-20 32 32)"/>
  <circle cx="32" cy="32" r="19" fill="url(#ps-planet)"/>
  <!-- ring, front half (over the planet) -->
  <g clip-path="url(#ps-front)" transform="rotate(-20 32 32)">
    <ellipse cx="32" cy="32" rx="29" ry="8.5" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3"/>
  </g>
</svg>
